<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinit Simulation Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at top, #1e1b4b, #0f172a);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 16px;
            padding: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }
        .card h3 {
            color: #f1f5f9;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
        .card p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        a.btn {
            display: inline-block;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }
        a.btn:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
        }
    </style>
</head>
<body>

    <header>
        <h1>Vinit Simulation Hub 🚀</h1>
        <p class="subtitle">Interactive Physics & Mathematics Visualizations</p>
    </header>

    <div class="container">
        <div class="card">
            <h3>Projectile Motion</h3>
            <p>Analyze the trajectory, launch angles, and velocity components of moving projectiles in real-time.</p>
            <a href="projects/projectile.html" class="btn">Launch Simulation →</a>
        </div>
    </div>

</body>
</html>

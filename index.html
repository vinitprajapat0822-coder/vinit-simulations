<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinit Physics & Math Simulations</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #38bdf8; }
        .search-box { width: 100%; max-width: 500px; padding: 12px; margin: 20px auto; display: block; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; cursor: pointer; border: 1px solid #334155; transition: 0.2s; }
        .card:hover { border-color: #38bdf8; transform: translateY(-3px); }
        .card h3 { margin: 0 0 10px 0; color: #f8fafc; }
        .card p { color: #94a3b8; font-size: 14px; margin: 0; }
        #viewer { max-width: 800px; margin: 20px auto; background: #1e293b; padding: 20px; border-radius: 8px; display: none; }
        .back-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; }
        iframe { width: 100%; height: 400px; border: none; background: #000; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Vinit Simulation Hub</h1>
    
    <!-- Search Bar -->
    <input type="text" id="searchBar" class="search-box" placeholder="सिमुलेशन का नाम सर्च करें..." onkeyup="filterSimulations()">

    <!-- Simulation List Grid -->
    <div class="grid" id="simList">
        <!-- Project 1 -->
        <div class="card" onclick="loadSim('Projectile Motion', 'projects/projectile.html')">
            <h3>प्रोजेक्टाइल मोशन (Projectile Motion)</h3>
            <p>भौतिकी (Physics) - गति और कोण सिमुलेशन</p>
        </div>
    </div>

    <!-- Simulation Player Viewer -->
    <div id="viewer">
        <button class="back-btn" onclick="goBack()">← पीछे जाएं (Back)</button>
        <h2 id="simTitle"></h2>
        <iframe id="simFrame" src=""></iframe>
    </div>

    <script>
        function filterSimulations() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                let text = cards[i].innerText.toLowerCase();
                cards[i].style.display = text.includes(input) ? "" : "none";
            }
        }

        function loadSim(title, url) {
            document.getElementById('simList').style.display = 'none';
            document.getElementById('searchBar').style.display = 'none';
            document.getElementById('viewer').style.display = 'block';
            document.getElementById('simTitle').innerText = title;
            document.getElementById('simFrame').src = url;
        }

        function goBack() {
            document.getElementById('simFrame').src = '';
            document.getElementById('viewer').style.display = 'none';
            document.getElementById('simList').style.display = 'grid';
            document.getElementById('searchBar').style.display = 'block';
        }
    </script>
</body>
</html>

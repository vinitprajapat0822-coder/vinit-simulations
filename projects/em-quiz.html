<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E&M Quick Quiz | Vinit Simulation Hub</title>
<link rel="stylesheet" href="../lab-polish.css?v=2">
<style>
:root{color-scheme:dark;--bg:#080b16;--panel:rgba(16,24,48,.62);--text:#f2f6ff;--muted:#9cabc8;--cyan:#63e6ff;--violet:#a78bfa;--green:#7cf0bd;--red:#ff8e9c;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(800px,calc(100% - 24px));margin:auto}
header{position:sticky;top:0;z-index:10;background:rgba(8,11,22,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{min-height:56px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:8px;align-items:center;font-weight:800}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#67e8f9,#a78bfa);font-weight:900}
.hero{padding:18px 0 8px}.eyebrow{display:inline-block;border:1px solid rgba(99,230,255,.35);color:var(--cyan);border-radius:99px;padding:4px 12px;font-size:11px;font-weight:700}
h1{font-size:clamp(22px,4vw,30px);margin:10px 0 6px}.lead{color:var(--muted);margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;backdrop-filter:blur(16px)}
.q{font-weight:700;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;border:1px solid #34425e;background:#141e33;color:var(--text);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;font-weight:600}
.opt:hover{border-color:var(--cyan)}
.opt.correct{border-color:var(--green);background:rgba(124,240,189,.12)}
.opt.wrong{border-color:var(--red);background:rgba(255,142,156,.12)}
.why{color:var(--muted);font-size:13px;margin-top:10px;display:none}
.score{font-size:18px;font-weight:800;color:var(--cyan)}
.btn{border:0;border-radius:12px;background:linear-gradient(135deg,#67e8f9,#a78bfa);color:#07111b;padding:12px 18px;font-weight:800;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="../index.html"><span class="logo">V</span>E & M</a><a href="../index.html" style="color:var(--cyan);font-weight:700">← Hub</a></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">QUIZ</div><h1>E&M Quick Quiz</h1><p class="lead">Check core electrostatics and current ideas. Pick an answer to see the explanation.</p>
<p class="score" id="score">Score: 0 / 0</p></section>
<div id="quiz"></div>
<button class="btn" id="reset">Restart quiz</button>
</main>
<script src="../lab-theme.js?v=3"></script>
<script>
const questions = [{'q': 'Coulomb force between two point charges varies as', 'options': ['1/r', '1/r²', '1/r³', 'r²'], 'answer': 1, 'why': 'F = k|q1 q2|/r² — inverse-square law.'}, {'q': 'Ohm’s law states', 'options': ['P = VI', 'V = IR', 'F = qE', 'E = −dV/dx'], 'answer': 1, 'why': 'For ohmic resistors, V = IR.'}, {'q': 'Capacitors in series have', 'options': ['Same voltage', 'Same charge', 'Ceq = C1+C2', 'Infinite resistance'], 'answer': 1, 'why': 'Series: same charge; voltages add.'}, {'q': 'Magnetic field around a long straight wire', 'options': ['Uniform parallel to wire', 'Circles the wire', 'Zero outside', 'Points radially out'], 'answer': 1, 'why': 'B forms concentric circles; B = μ0 I/(2πr).'}, {'q': 'Motional emf for a rod on rails is', 'options': ['Bℓ/v', 'Bℓv', 'ℓv/B', 'B/ℓv'], 'answer': 1, 'why': 'ε = Bℓv when B, ℓ, v are mutually perpendicular.'}];
let answered=0, correct=0;
const box=document.getElementById('quiz');
const scoreEl=document.getElementById('score');
function render(){
  box.innerHTML='';
  questions.forEach((item,qi)=>{
    const card=document.createElement('div'); card.className='card';
    card.innerHTML='<div class="q">'+(qi+1)+'. '+item.q+'</div>';
    const why=document.createElement('div'); why.className='why'; why.textContent=item.why;
    item.options.forEach((op,oi)=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=op;
      b.onclick=()=>{
        if(b.disabled) return;
        [...card.querySelectorAll('.opt')].forEach(x=>x.disabled=true);
        answered++;
        if(oi===item.answer){b.classList.add('correct');correct++;}
        else{b.classList.add('wrong'); card.querySelectorAll('.opt')[item.answer].classList.add('correct');}
        why.style.display='block';
        scoreEl.textContent='Score: '+correct+' / '+answered;
      };
      card.appendChild(b);
    });
    card.appendChild(why);
    box.appendChild(card);
  });
}
document.getElementById('reset').onclick=()=>{answered=0;correct=0;scoreEl.textContent='Score: 0 / 0';render();};
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<style>
:root{color-scheme:dark;--bg:#080b16;--panel:rgba(16,24,48,.55);--text:#f2f6ff;--muted:#9cabc8;--cyan:#63e6ff;--violet:#a78bfa;--green:#7cf0bd;--line:rgba(255,255,255,.12);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,rgba(99,102,241,.18),transparent 42%),var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(1200px,calc(100% - 28px));margin:auto}
header{position:sticky;top:0;z-index:10;background:rgba(8,11,22,.75);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav{min-height:58px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-weight:850}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#67e8f9,#a78bfa);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 22px rgba(99,102,241,.35)}
.brand small{display:block;font-size:10px;color:var(--muted)}.nav a:last-child{color:var(--cyan);font-size:13px}
.hero{padding:24px 0 14px}.eyebrow{display:inline-block;border:1px solid rgba(99,230,255,.35);background:rgba(99,230,255,.08);color:var(--cyan);border-radius:99px;padding:4px 12px;font-size:11px;font-weight:750}
.hero h1{font-size:clamp(24px,4.5vw,38px);margin:10px 0 6px}.grad{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:0;max-width:680px}
.layout{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:14px;padding-bottom:28px}@media(max-width:860px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(18px);overflow:hidden}
.panel-head{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:750}.panel-body{padding:14px}
.field{margin-bottom:12px}.field label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.hint{color:var(--muted);font-size:11px}
input[type=range]{width:100%;accent-color:var(--cyan)}.inputrow{display:grid;grid-template-columns:1fr 70px;gap:8px}
input[type=number],select{width:100%;padding:7px;border-radius:10px;border:1px solid #31415f;background:#0a1220;color:var(--text)}
.btn{border:1px solid #34425e;border-radius:11px;background:#141e33;color:var(--text);padding:10px;font-weight:750;cursor:pointer}.btn.primary{background:var(--cyan);color:#07111b;border-color:var(--cyan)}
.actions{display:flex;gap:8px;margin-top:8px}.actions .btn{flex:1}
canvas{display:block;width:100%;height:360px;border-radius:14px;background:linear-gradient(180deg,#0c1426,#070f1c);border:1px solid #24314b}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.result{background:rgba(8,14,28,.8);border:1px solid #2a3a58;border-radius:12px;padding:10px}.result span{display:block;font-size:11px;color:var(--muted)}.result strong{font-size:15px}
.formulas{font-size:13px;color:var(--muted);line-height:1.7}.formulas code{color:var(--cyan)}

/* Batch 8 · Liquid Flow UI layer */
body{position:relative;isolation:isolate}
#fluid-bg{position:fixed!important;inset:0!important;z-index:-1!important;display:block!important;width:100vw!important;height:100vh!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;opacity:.88;pointer-events:none!important;touch-action:none!important}
.wrap{width:100%;max-width:1600px;margin-inline:auto;padding-inline:12px}
.control-panel{position:relative;border:1px solid rgba(98,231,255,.24)!important;background:linear-gradient(145deg,rgba(16,24,48,.72),rgba(8,14,28,.68))!important;-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:0 16px 42px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(98,231,255,.05)}
.control-panel .ph,.control-panel .panel-head{border-bottom-color:rgba(255,255,255,.12)}
input[type=range]{accent-color:#00f0ff;filter:drop-shadow(0 0 5px rgba(0,240,255,.35))}
input[type=range]::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(0,240,255,.13),0 0 17px rgba(0,240,255,.72),inset 0 1px 2px rgba(255,255,255,.9)}
input[type=range]::-moz-range-thumb{box-shadow:0 0 0 4px rgba(0,240,255,.13),0 0 17px rgba(0,240,255,.72),inset 0 1px 2px rgba(255,255,255,.9)}
.simulation-stage,.liquid-canvas-stage{position:relative;isolation:isolate;width:100%;min-width:0;border-radius:16px;overflow:hidden}
.simulation-stage>canvas:not(#fluid-bg),.liquid-canvas-stage>canvas:not(#fluid-bg){position:relative;z-index:0;display:block;width:100%;max-width:100%}
.start-overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 50% 42%,rgba(14,30,52,.52),rgba(3,7,16,.78));-webkit-backdrop-filter:blur(13px) saturate(145%);backdrop-filter:blur(13px) saturate(145%)}
.start-overlay[hidden]{display:none!important}
.start-card{width:min(100%,360px);padding:24px 22px;text-align:center;border:1px solid rgba(255,255,255,.2);border-top-color:rgba(255,255,255,.52);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(12,21,38,.62));box-shadow:0 22px 55px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,240,255,.08)}
.start-kicker{display:block;margin-bottom:9px;color:#00f0ff;font-size:10px;font-weight:850;letter-spacing:.18em}
.start-card h2{margin:0 0 7px;color:#f2f7ff;font-size:clamp(18px,3vw,23px)}
.start-card p{margin:0 0 17px;color:#c0cce0;font-size:12px;line-height:1.6}
.start-cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:46px;padding:11px 16px;border:1px solid rgba(255,255,255,.55);border-radius:13px;color:#041018;background:linear-gradient(120deg,#a5f4ff,#00f0ff 55%,#aaa0ff);box-shadow:0 10px 26px rgba(0,240,255,.22),inset 0 1px 0 rgba(255,255,255,.7);font-weight:900;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease}
.start-cta:hover{transform:translateY(-1px);box-shadow:0 13px 32px rgba(0,240,255,.3),inset 0 1px 0 rgba(255,255,255,.8)}
.start-cta:active{transform:scale(.97)}
@media(max-width:600px){.start-card{padding:20px 17px}.simulation-stage,.liquid-canvas-stage{border-radius:12px}}

<body>
<canvas id="fluid-bg" aria-hidden="true"></canvas>
<header><div class="wrap nav">
  <a class="brand" href="../index.html"><span class="logo">∑</span><span>VINIT SIMULATION HUB<small>E & M · MAGNETISM</small></span></a>
  <a href="../index.html">← Back to Hub</a>
</div></header>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">E & M · MAGNETISM</div>
    <h1>Magnetic Force (F = qvB)</h1>
    <p id="lab-lead"></p>
  </section>
  <div class="layout">
    <aside class="panel control-panel"><div class="panel-head">Controls</div><div class="panel-body">
      <div class="field"><label>Charge q (μC) <span class="hint" id="qV">5</span></label><input type="range" id="q" min="1" max="20" value="5"></div>
<div class="field"><label>Speed v (m/s) <span class="hint" id="vV">10</span></label><input type="range" id="v" min="1" max="30" value="10"></div>
<div class="field"><label>B field (T) <span class="hint" id="BV">0.5</span></label><input type="range" id="B" min="0.1" max="2" step="0.1" value="0.5"></div>
      <div class="actions"><button class="btn primary" id="playBtn">Play</button><button class="btn" id="resetBtn">Reset</button></div>
    </div></aside>
    <div>
      <div class="panel" style="margin-bottom:14px"><div class="panel-body"><div class="simulation-stage" id="simulation-stage"><canvas id="canvas" width="800" height="360"></canvas><div class="start-overlay" id="startOverlay"><div class="start-card"><span class="start-kicker">VSH · CORE ENGINE</span><h2>Ready to simulate?</h2><p>Launch the lab to begin the interactive canvas experience.</p><button type="button" class="start-cta" id="startSimulationBtn">Start Simulation <span aria-hidden="true">→</span></button></div></div></div></div></div>
      <div class="panel" style="margin-bottom:14px"><div class="panel-head">Results</div><div class="panel-body"><div class="results" id="results"></div></div></div>
      <div class="panel"><div class="panel-head">Formulas</div><div class="panel-body formulas"><div><code>F = q v B</code> (v ⟂ B)</div><div><code>r = m v / (q B)</code> circular path</div></div></div>
    </div>
  </div>
</main>
<script src="../core/CanvasManager.js"></script>
<script src="../core/SimulationEngine.js"></script>
<script>
(function(){
const canvas=document.getElementById('canvas');
let engine=null,started=false,ang=0;
const canvasManager=new CanvasManager(canvas,{onResize(){if(engine)engine.renderNow();}});
const ctx=canvasManager.context;
const q=document.getElementById('q'),v=document.getElementById('v'),B=document.getElementById('B');
const playBtn=document.getElementById('playBtn');
document.getElementById('lab-lead').textContent='Positive charge in uniform B (into page) moves in a circle.';
function sync(){
  qV.textContent=q.value;vV.textContent=v.value;BV.textContent=B.value;
  if(engine&&!engine.isRunning)engine.renderNow();
}
function results(){
  const F=(parseFloat(q.value)*1e-6)*parseFloat(v.value)*parseFloat(B.value);
  document.getElementById('results').innerHTML='<div class="result"><span>F</span><strong>'+F.toExponential(2)+' N</strong></div><div class="result"><span>Direction</span><strong>⊥ to v and B</strong></div>';
}
function draw(){
  const W=canvasManager.width,H=canvasManager.height;
  ctx.fillStyle='#0a1220';ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H/2,R=50+parseFloat(v.value)*2;
  ctx.strokeStyle='#334155';ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
  // B into page marks
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ctx.fillStyle='#475569';ctx.beginPath();ctx.arc(cx+Math.cos(a)*R*0.6,cy+Math.sin(a)*R*0.6,2,0,Math.PI*2);ctx.fill();}
  const px=cx+R*Math.cos(ang),py=cy+R*Math.sin(ang);
  ctx.fillStyle='#63e6ff';ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
  results();
}
engine=new SimulationEngine({
  maxDelta:0.032,
  update(dt){ang+=parseFloat(v.value)*0.02*dt*60;},
  render:draw,
  onReset(){ang=0;},
  onStateChange({running}){playBtn.textContent=running?'Pause':'Play';}
});
['q','v','B'].forEach(id=>document.getElementById(id).oninput=sync);
playBtn.onclick=function(){if(!started)return;if(engine.isRunning)engine.pause();else engine.resume();};
document.getElementById('resetBtn').onclick=function(){engine.reset();sync();};
document.getElementById('startSimulationBtn').addEventListener('click',function(){
  started=true;document.getElementById('startOverlay').hidden=true;engine.start();
});
sync();engine.renderNow();
})();
</script>
<script src="../lab-theme.js?v=3"></script>
<script id="liquid-flow-runtime">
(function(){
  const canvas=document.getElementById('fluid-bg');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  let width=0,height=0,dpr=1,lastFrame=0,phase=0,rafId=0;
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,1.5);
    width=window.innerWidth;height=window.innerHeight;
    canvas.width=Math.max(1,Math.round(width*dpr));
    canvas.height=Math.max(1,Math.round(height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function frame(timestamp){
    rafId=requestAnimationFrame(frame);
    if(timestamp-lastFrame<1000/30)return;
    const dt=lastFrame?Math.min(0.05,(timestamp-lastFrame)/1000):0;
    lastFrame=timestamp;phase+=dt*0.22;
    ctx.clearRect(0,0,width,height);
    let g=ctx.createRadialGradient(width*(0.16+0.025*Math.sin(phase)),height*0.22,0,width*0.16,height*0.22,Math.max(width,height)*0.72);
    g.addColorStop(0,'rgba(0,240,255,.12)');g.addColorStop(1,'rgba(0,240,255,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,width,height);
    g=ctx.createRadialGradient(width*(0.84+0.02*Math.cos(phase*.8)),height*0.74,0,width*.84,height*.74,Math.max(width,height)*.62);
    g.addColorStop(0,'rgba(130,105,255,.11)');g.addColorStop(1,'rgba(130,105,255,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,width,height);
  }
  function stop(){if(rafId)cancelAnimationFrame(rafId);window.removeEventListener('resize',resize);}
  resize();window.addEventListener('resize',resize,{passive:true});rafId=requestAnimationFrame(frame);
  window.addEventListener('pagehide',stop,{once:true});
})();
</script>
</body>

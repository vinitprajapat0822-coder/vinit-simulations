<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lens Formula Lab | Vinit Simulation Hub</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#080b16;color:#f2f6ff;font:15px/1.5 system-ui,sans-serif}
a{color:#63e6ff;text-decoration:none}.wrap{width:min(1000px,calc(100% - 24px));margin:auto}
header{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;background:rgba(8,11,22,.85);backdrop-filter:blur(12px)}
.nav{display:flex;justify-content:space-between;align-items:center}.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#67e8f9,#a78bfa);font-weight:900}
h1{font-size:1.5rem;margin:16px 0 6px}.lead{color:#9cabc8}
.panel{background:rgba(16,24,48,.55);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;margin:12px 0;backdrop-filter:blur(16px)}
label{display:flex;justify-content:space-between;font-size:12px;margin:8px 0 4px}input[type=range]{width:100%;accent-color:#63e6ff}
canvas{width:100%;height:300px;border-radius:12px;background:#0a1220;border:1px solid #24314b;display:block}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.result{background:rgba(8,14,28,.8);border:1px solid #2a3a58;border-radius:10px;padding:8px}.result span{display:block;font-size:10px;color:#9cabc8}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#63e6ff;color:#07111b;margin-right:8px}
</style></head><body>
<header><div class="wrap nav"><a href="../index.html" style="display:flex;gap:8px;align-items:center;color:inherit;font-weight:800"><span class="logo">V</span>OPTICS</a><a href="../index.html">← Hub</a></div></header>
<main class="wrap">
<h1>Lens Formula Lab</h1><p class="lead">Interactive physics lab</p>
<div class="panel">
<label>Parameter A <span id="aV">5</span></label><input type="range" id="a" min="1" max="20" step="0.5" value="5">
<label>Parameter B <span id="bV">3</span></label><input type="range" id="b" min="1" max="20" step="0.5" value="3">
<button class="btn" id="play">Play</button>
</div>
<div class="panel"><canvas id="c" width="800" height="300"></canvas>
<div class="results" id="res"></div>
</div>
</main>
<script src="../lab-theme.js?v=1"></script>
<script>
(function(){
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const a=document.getElementById('a'),b=document.getElementById('b');
let t=0,playing=true,last=0;
function sync(){aV.textContent=a.value;bV.textContent=b.value;}
a.oninput=b.oninput=function(){sync();draw();};
function draw(){
 const d=Math.min(devicePixelRatio||1,2);const W=canvas.clientWidth||700,H=300;
 canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);
 ctx.fillStyle='#0a1220';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#63e6ff';ctx.beginPath();
 for(let i=0;i<W;i++){const y=H/2+(10+(+a.value))*Math.sin(i/(20+(+b.value)/5)-t*2);ctx.lineTo(i,y);}
 ctx.stroke();
 ctx.fillStyle='#a78bfa';ctx.beginPath();ctx.arc((t*40*(+a.value/5))%(W-20),H/2,8,0,6.28);ctx.fill();
 document.getElementById('res').innerHTML='<div class="result"><span>A</span><strong>'+a.value+'</strong></div><div class="result"><span>B</span><strong>'+b.value+'</strong></div><div class="result"><span>A×B</span><strong>'+(+a.value*(+b.value)).toFixed(1)+'</strong></div>';
}
function loop(ts){if(!playing)return;if(!last)last=ts;last=ts;t+=0.016;draw();requestAnimationFrame(loop);}
document.getElementById('play').onclick=function(){playing=!playing;this.textContent=playing?'Pause':'Play';last=0;if(playing)requestAnimationFrame(loop);};
sync();requestAnimationFrame(loop);
})();
</script></body></html>

<!DOCTYPE html>

<link rel="stylesheet" href="../lab-polish.css?v=2">
<style>
:root{color-scheme:dark}body{margin:0;background:#080b16;color:#f2f6ff;font:15px/1.5 system-ui,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 24px));margin:auto}

.nav{min-height:54px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:8px;align-items:center;font-weight:800}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#67e8f9,#a78bfa);font-weight:900}
.hero{padding:16px 0 8px}.eyebrow{display:inline-block;border:1px solid rgba(99,230,255,.3);color:#63e6ff;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700}
h1{font-size:clamp(20px,4vw,28px);margin:8px 0 4px}.lead{color:#9cabc8;margin:0}
.layout{display:grid;grid-template-columns:minmax(250px,300px) 1fr;gap:12px;padding-bottom:24px}@media(max-width:800px){.layout{grid-template-columns:1fr}}
.panel{background:rgba(16,24,48,.55);border:1px solid rgba(255,255,255,.12);border-radius:16px;backdrop-filter:blur(16px);margin-bottom:12px}
.ph{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.12);font-weight:700}.pb{padding:12px}
label.row{display:flex;justify-content:space-between;font-size:12px;margin:8px 0 4px}input[type=range]{width:100%;accent-color:#63e6ff}
.btn{border:1px solid #34425e;border-radius:11px;background:#141e33;color:#f2f6ff;padding:10px;font-weight:700;cursor:pointer;flex:1}.btn.primary{background:linear-gradient(135deg,#67e8f9,#a78bfa);color:#07111b;border:0}
.actions{display:flex;gap:8px;margin-top:10px}canvas{display:block;width:100%;height:340px;border-radius:12px;background:#0a1220;border:1px solid #24314b}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.result{background:rgba(8,14,28,.8);border:1px solid #2a3a58;border-radius:10px;padding:8px}.result span{display:block;font-size:10px;color:#9cabc8}
.formulas{font-size:12px;color:#9cabc8;line-height:1.7}code{color:#63e6ff}
</style><style id="batch14-liquid-template">
body{isolation:isolate;background:radial-gradient(ellipse at 14% 0%,rgba(0,240,255,.075),transparent 42%),radial-gradient(ellipse at 90% 100%,rgba(130,105,255,.07),transparent 44%),#020408}
.wrap,main.wrap{width:100%;max-width:1600px;margin-inline:auto;padding-inline:12px}
#fluid-bg{position:fixed!important;inset:0!important;z-index:-1!important;display:block!important;width:100vw!important;height:100vh!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;opacity:.82;pointer-events:none!important;touch-action:none!important}
.control-panel{position:relative;min-width:0;border:1px solid rgba(0,240,255,.22)!important;border-radius:18px;background:linear-gradient(145deg,rgba(16,24,48,.74),rgba(8,14,28,.68))!important;-webkit-backdrop-filter:blur(24px) saturate(165%);backdrop-filter:blur(24px) saturate(165%);box-shadow:0 18px 44px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,240,255,.06)}
.control-panel .ph{border-bottom-color:rgba(255,255,255,.12)}
input[type=range]{accent-color:#00f0ff;filter:drop-shadow(0 0 5px rgba(0,240,255,.36));touch-action:pan-y}
input[type=range]::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(0,240,255,.13),0 0 17px rgba(0,240,255,.72),inset 0 1px 2px rgba(255,255,255,.9)}
input[type=range]::-moz-range-thumb{box-shadow:0 0 0 4px rgba(0,240,255,.13),0 0 17px rgba(0,240,255,.72),inset 0 1px 2px rgba(255,255,255,.9)}
.simulation-stage{position:relative;isolation:isolate;width:100%;min-width:0;border-radius:16px;overflow:hidden}
.simulation-stage>canvas{position:relative;z-index:0;display:block;width:100%;max-width:100%;height:min(430px,54vh)}
.start-overlay{position:absolute;z-index:3;inset:0;display:grid;place-items:center;padding:clamp(12px,3vw,24px);border:1px solid rgba(255,255,255,.1);border-radius:14px;background:linear-gradient(145deg,rgba(2,6,16,.63),rgba(2,6,16,.46));-webkit-backdrop-filter:blur(12px) saturate(145%);backdrop-filter:blur(12px) saturate(145%);transition:opacity .45s ease,transform .5s cubic-bezier(.22,1,.36,1)}
.start-overlay[hidden]{display:none!important}
.start-card{width:min(440px,100%);padding:clamp(20px,4vw,34px);border:1px solid transparent;border-radius:20px;background:linear-gradient(145deg,rgba(16,25,45,.96),rgba(8,14,28,.96)) padding-box,linear-gradient(135deg,rgba(0,240,255,.52),rgba(130,105,255,.4),rgba(255,255,255,.1)) border-box;box-shadow:0 22px 55px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.12);text-align:center}
.start-kicker{color:#00f0ff;font-size:9px;font-weight:900;letter-spacing:.16em}
.start-card h2{margin:9px 0 8px;color:var(--text,#f2f6ff);font-size:clamp(22px,4vw,31px);letter-spacing:-.04em}
.start-card p{max-width:38ch;margin:0 auto 18px;color:var(--muted,#9cabc8);font-size:13px;line-height:1.65}
.start-cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;padding:14px 18px;border:1px solid transparent;border-radius:14px;background:linear-gradient(110deg,#00f0ff,#8270ff);color:#020408;font:inherit;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 10px 28px rgba(0,240,255,.2);transition:transform .22s ease,box-shadow .22s ease}
.start-cta:active{transform:scale(.97);box-shadow:0 0 26px rgba(0,240,255,.28)}
button:disabled{opacity:.48;cursor:not-allowed}
@media(max-width:600px){.start-card{padding:20px 17px}.simulation-stage{border-radius:12px}.start-overlay{padding:10px}}
@media(prefers-reduced-motion:reduce){.start-overlay,.start-cta{transition:none!important}}
</style>
</head><body>
<canvas id="fluid-bg" aria-hidden="true"></canvas>
<header><div class="wrap nav"><a class="brand" href="../index.html"><span class="logo">V</span>WAVES</a><a href="../index.html" style="color:#63e6ff">← Hub</a></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">WAVES</div><h1>Wave Equation</h1><p class="lead">Travelling wave y=A sin(ωt−kx).</p></section>
<div class="layout">
<aside class="panel"><div class="ph">Controls</div><div class="pb"><label class="row">A <span id="AV">30</span></label><input type="range" id="A" min="10" max="60" step="1" value="30">
<label class="row">k <span id="kV">0.08</span></label><input type="range" id="k" min="0.02" max="0.2" step="0.01" value="0.08">
<label class="row">ω <span id="wV">4</span></label><input type="range" id="w" min="1" max="10" step="0.2" value="4"><div class="actions"><button class="btn primary" id="playBtn">Play</button><button class="btn" id="resetBtn">Reset</button></div></div></aside>
<div>
<div class="panel"><div class="pb"><div class="simulation-stage" id="simulation-stage"><canvas id="c" width="800" height="340"></canvas><div class="start-overlay" id="startOverlay" role="region" aria-label="Start simulation"><div class="start-card"><span class="start-kicker">VSH · CORE ENGINE</span><h2>Ready to simulate?</h2><p>Start the lab to open the interactive visualization and controls.</p><button type="button" class="start-cta" id="startSimulationBtn">Start Simulation <span aria-hidden="true">→</span></button></div></div></div></div></div>
<div class="panel"><div class="ph">Live results</div><div class="pb"><div class="results" id="res"></div></div></div>
<div class="panel"><div class="ph">Formulas</div><div class="pb formulas"><code>y = A sin(ωt − kx)</code></div></div>
</div></div></main>
<script src="../lab-theme.js?v=3"></script>
<script src="../core/CanvasManager.js"></script>
<script src="../core/SimulationEngine.js"></script>
<script>
(function(){"use strict";
const canvas=document.getElementById("c"),A=document.getElementById("A"),k=document.getElementById("k"),w=document.getElementById("w"),AV=document.getElementById("AV"),kV=document.getElementById("kV"),wV=document.getElementById("wV"),playBtn=document.getElementById("playBtn"),resetBtn=document.getElementById("resetBtn"),res=document.getElementById("res");
let t=0,hasStarted=false,engine=null;const canvasManager=new CanvasManager(canvas,{maxDpr:2,onResize(){if(engine)engine.renderNow();}}),ctx=canvasManager.context;
function draw(){
 const W=canvasManager.width,H=canvasManager.height;ctx.fillStyle='#0a1220';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#63e6ff';ctx.beginPath();for(let i=0;i<W;i++)ctx.lineTo(i,H/2+(+A.value)*Math.sin(+w.value*t-+k.value*i));ctx.stroke();
res.innerHTML=`<div class="result"><span>λ</span><strong>${(2*Math.PI/+k.value).toFixed(1)}</strong></div>`;
}
function sync(){AV.textContent=A.value;kV.textContent=k.value;wV.textContent=w.value;if(engine&&!engine.isRunning)engine.renderNow();}
engine=new SimulationEngine({maxDelta:.05,update(dt){t+=dt*60*.016;},render:draw,onReset(){t=0;},onStateChange({running}){playBtn.textContent=running?"Pause":"Play";}});
[A,k,w].forEach(function(el){el.addEventListener("input",sync);});
playBtn.disabled=true;playBtn.addEventListener("click",function(){if(!hasStarted)return;if(engine.isRunning)engine.pause();else engine.start();});
resetBtn.addEventListener("click",function(){engine.reset();A.value=30;k.value=.08;w.value=4;sync();});
document.getElementById("startSimulationBtn").addEventListener("click",function(){if(hasStarted)return;hasStarted=true;playBtn.disabled=false;document.getElementById("startOverlay").hidden=true;engine.start();});
sync();engine.renderNow();window.addEventListener("pagehide",function(){engine.destroy();canvasManager.destroy();},{once:true});
})();
</script><script id="liquid-flow-background">(function(){"use strict";const canvas=document.getElementById("fluid-bg");if(!canvas)return;const ctx=canvas.getContext("2d");if(!ctx)return;let width=0,height=0,dpr=1,lastFrame=0,phase=0,rafId=0,running=true;function resize(){dpr=Math.min(window.devicePixelRatio||1,1.5);width=window.innerWidth;height=window.innerHeight;canvas.width=Math.max(1,Math.round(width*dpr));canvas.height=Math.max(1,Math.round(height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);paint();}function paint(){ctx.clearRect(0,0,width,height);let g=ctx.createRadialGradient(width*(.16+.025*Math.sin(phase)),height*.22,0,width*.16,height*.22,Math.max(width,height)*.72);g.addColorStop(0,"rgba(0,240,255,.12)");g.addColorStop(1,"rgba(0,240,255,0)");ctx.fillStyle=g;ctx.fillRect(0,0,width,height);g=ctx.createRadialGradient(width*(.84+.02*Math.cos(phase*.8)),height*.74,0,width*.84,height*.74,Math.max(width,height)*.62);g.addColorStop(0,"rgba(130,105,255,.11)");g.addColorStop(1,"rgba(130,105,255,0)");ctx.fillStyle=g;ctx.fillRect(0,0,width,height);}function frame(timestamp){if(!running||document.hidden)return;rafId=requestAnimationFrame(frame);if(timestamp-lastFrame<1000/30)return;const dt=lastFrame?Math.min(.05,(timestamp-lastFrame)/1000):0;lastFrame=timestamp;phase+=dt*.22;paint();}function stop(){running=false;if(rafId)cancelAnimationFrame(rafId);rafId=0;}function resume(){if(running||document.hidden)return;running=true;lastFrame=0;rafId=requestAnimationFrame(frame);}resize();window.addEventListener("resize",resize,{passive:true});document.addEventListener("visibilitychange",function(){if(document.hidden)stop();else resume();});rafId=requestAnimationFrame(frame);window.addEventListener("pagehide",function(){stop();window.removeEventListener("resize",resize);},{once:true});})();</script>
</body></html>

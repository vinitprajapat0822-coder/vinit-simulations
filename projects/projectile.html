<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projectile Motion Simulation</title>
    <style>
        body { background: #000; color: #fff; text-align: center; font-family: sans-serif; padding-top: 30px; }
        canvas { background: #111; border: 2px solid #38bdf8; border-radius: 8px; }
    </style>
</head>
<body>
    <h2>Projectile Motion Canvas</h2>
    <canvas id="simCanvas" width="400" height="250"></canvas>
    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#38bdf8';
        ctx.font = '18px Arial';
        ctx.fillText('यहाँ सिमुलेशन रन हो रहा है!', 80, 130);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectile Motion Simulation - Vinit Simulation Hub</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .controls {
            margin: 15px 0;
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
        }
        label {
            margin: 0 10px;
            font-size: 14px;
        }
        input {
            width: 60px;
            padding: 4px;
            text-align: center;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
        button:hover {
            background-color: #0369a1;
        }
        canvas {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #38bdf8;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Projectile Motion Simulation</h1>
    <p>Explore the physics of an object launched into the air!</p>

    <div class="controls">
        <label>Speed (m/s): <input type="number" id="velocity" value="25" min="5" max="50"></label>
        <label>Angle (°): <input type="number" id="angle" value="45" min="10" max="80"></label>
        <button onclick="startSimulation()">Launch 🚀</button>
        <button onclick="resetSimulation()" style="background-color: #475569;">Reset</button>
    </div>

    <div>
        <canvas id="simCanvas" width="700" height="400"></canvas>
    </div>

    <div>
        <a href="../index.html" class="back-link">← Back to Simulation Hub</a>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let x = 50, y = 350;
        let vx = 0, vy = 0;
        let gravity = 0.5;
        let isRunning = false;
        let animationId;

        const groundY = 350;
        const startX = 50;

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#334155';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#38bdf8';
            ctx.fill();
            ctx.closePath();
        }

        function update() {
            if (!isRunning) return;

            x += vx;
            y -= vy;
            vy -= gravity;

            if (y >= groundY) {
                y = groundY;
                isRunning = false;
            }

            drawScene();

            if (isRunning) {
                animationId = requestAnimationFrame(update);
            }
        }

        function startSimulation() {
            cancelAnimationFrame(animationId);
            
            let v0 = parseFloat(document.getElementById('velocity').value);
            let angleDeg = parseFloat(document.getElementById('angle').value);
            let angleRad = angleDeg * (Math.PI / 180);

            x = startX;
            y = groundY;

            vx = v0 * Math.cos(angleRad) * 0.4;
            vy = v0 * Math.sin(angleRad) * 0.4;

            isRunning = true;
            update();
        }

        function resetSimulation() {
            cancelAnimationFrame(animationId);
            isRunning = false;
            x = startX;
            y = groundY;
            drawScene();
        }

        resetSimulation();
    </script>

</body>
</html>

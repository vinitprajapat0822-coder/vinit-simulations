<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectile Motion Lab — Vinit Simulation Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 1rem; }
        .nav-back { display: inline-block; color: var(--accent); text-decoration: none; margin-bottom: 1rem; font-weight: 600; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
        h2 { margin-bottom: 1rem; color: var(--accent); }
        canvas { background: #020617; border: 1px solid var(--border); border-radius: 8px; width: 100%; height: 400px; display: block; margin-bottom: 1.5rem; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .control-group { display: flex; flex-direction: column; }
        label { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.4rem; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
        .btn-group { display: flex; gap: 1rem; }
        button { background: var(--accent); color: var(--bg-color); border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; background: #0f172a; padding: 1rem; border-radius: 8px; }
        .stat-item span { display: block; font-size: 0.8rem; color: var(--text-secondary); }
        .stat-item strong { font-size: 1.1rem; color: var(--accent); }
    </style>
</head>
<body>
    <div style="max-width: 900px; margin: 0 auto;">
        <a href="../index.html" class="nav-back">← Back to Hub Catalog</a>
    </div>
    <div class="container">
        <h2>Projectile Motion Lab</h2>
        <canvas id="simCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <div class="control-group">
                <label>Initial Velocity ($v_0$): <span id="velVal">20</span> m/s</label>
                <input type="range" id="velocity" min="5" max="50" value="20" oninput="updateParams()">
            </div>
            <div class="control-group">
                <label>Launch Angle ($\theta$): <span id="angleVal">45</span>°</label>
                <input type="range" id="angle" min="0" max="90" value="45" oninput="updateParams()">
            </div>
        </div>

        <div class="btn-group" style="margin-bottom: 1.5rem;">
            <button onclick="startSimulation()">Fire / Restart</button>
            <button onclick="resetSimulation()" style="background: #334155; color: var(--text-color);">Reset</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span>Max Height ($H$)</span>
                <strong id="maxHeight">0.00 m</strong>
            </div>
            <div class="stat-item">
                <span>Total Range ($R$)</span>
                <strong id="maxRange">0.00 m</strong>
            </div>
            <div class="stat-item">
                <span>Time of Flight ($T$)</span>
                <strong id="flightTime">0.00 s</strong>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let v0 = 20;
        let angleDeg = 45;
        let g = 9.81;

        let t = 0;
        let animationId = null;
        let isRunning = false;

        function updateParams() {
            v0 = parseFloat(document.getElementById('velocity').value);
            angleDeg = parseFloat(document.getElementById('angle').value);
            document.getElementById('velVal').innerText = v0;
            document.getElementById('angleVal').innerText = angleDeg;
            calculateStats();
            if (!isRunning) drawStatic();
        }

        function calculateStats() {
            const rad = (angleDeg * Math.PI) / 180;
            const H = (Math.pow(v0 * Math.sin(rad), 2)) / (2 * g);
            const R = (Math.pow(v0, 2) * Math.sin(2 * rad)) / g;
            const T = (2 * v0 * Math.sin(rad)) / g;

            document.getElementById('maxHeight').innerText = H.toFixed(2) + ' m';
            document.getElementById('maxRange').innerText = R.toFixed(2) + ' m';
            document.getElementById('flightTime').innerText = T.toFixed(2) + ' s';
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;

            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Ground
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, 350); ctx.lineTo(canvas.width, 350); ctx.stroke();
        }

        function drawStatic() {
            drawGrid();
            // Draw launcher base
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(50, 330, 20, 20);
        }

        function startSimulation() {
            cancelAnimationFrame(animationId);
            t = 0;
            isRunning = true;
            animate();
        }

        function resetSimulation() {
            cancelAnimationFrame(animationId);
            isRunning = false;
            t = 0;
            drawStatic();
        }

        function animate() {
            drawGrid();
            const rad = (angleDeg * Math.PI) / 180;
            const scale = 3; // pixels per meter factor roughly

            const vx = v0 * Math.cos(rad);
            const vy = v0 * Math.sin(rad);

            const x = 50 + (vx * t) * scale;
            const y = 350 - (vy * t - 0.5 * g * t * t) * scale;

            // Draw trajectory trail/prediction could go here, let's draw projectile ball
            if (y <= 350) {
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();

                t += 0.05;
                animationId = requestAnimationFrame(animate);
            } else {
                isRunning = false;
            }
        }

        // Initial setup
        updateParams();
        drawStatic();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e1a">
<title>Relative Velocity | Vinit Simulation Hub</title>
<link rel="stylesheet" href="../lab-polish.css?v=2">
<style>
:root{color-scheme:dark;--bg:#080b16;--panel:rgba(16,24,48,.55);--text:#f2f6ff;--muted:#9cabc8;--cyan:#63e6ff;--violet:#a78bfa;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 24px));margin:auto}
header{position:sticky;top:0;z-index:5;background:rgba(8,11,22,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{min-height:54px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:8px;align-items:center;font-weight:800}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#67e8f9,#a78bfa);font-weight:900}
.hero{padding:16px 0 8px}.eyebrow{display:inline-block;border:1px solid rgba(99,230,255,.3);color:var(--cyan);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700}
h1{font-size:clamp(20px,4vw,30px);margin:8px 0 4px}p.lead{color:var(--muted);margin:0 0 8px}
.layout{display:grid;grid-template-columns:minmax(250px,300px) 1fr;gap:12px;padding-bottom:24px}@media(max-width:800px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(16px);margin-bottom:12px}
.ph{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}.pb{padding:12px}
label.row{display:flex;justify-content:space-between;font-size:12px;margin:8px 0 4px}input[type=range]{width:100%;accent-color:var(--cyan)}
.btn{border:1px solid #34425e;border-radius:11px;background:#141e33;color:var(--text);padding:10px;font-weight:700;cursor:pointer;flex:1}.btn.primary{background:linear-gradient(135deg,#67e8f9,#a78bfa);color:#07111b;border:0}
.actions{display:flex;gap:8px;margin-top:10px}canvas{display:block;width:100%;height:340px;border-radius:12px;background:#0a1220;border:1px solid #24314b}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.result{background:rgba(8,14,28,.8);border:1px solid #2a3a58;border-radius:10px;padding:8px}.result span{display:block;font-size:10px;color:var(--muted)}.result strong{font-size:13px}
.formulas{font-size:12px;color:var(--muted);line-height:1.7}code{color:var(--cyan)}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="../index.html"><span class="logo">V</span><span>KINEMATICS</span></a><a href="../index.html" style="color:var(--cyan)">← Hub</a></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">KINEMATICS</div><h1>Relative Velocity</h1><p class="lead">Two objects on a line — relative velocity v_A − v_B.</p></section>
<div class="layout">
<aside class="panel"><div class="ph">Controls</div><div class="pb"><label class="row">v_A (m/s) <span id="vaV">6</span></label><input type="range" id="va" min="-10" max="15" step="0.5" value="6">
<label class="row">v_B (m/s) <span id="vbV">2</span></label><input type="range" id="vb" min="-10" max="15" step="0.5" value="2"><div class="actions"><button class="btn primary" id="playBtn">Play</button><button class="btn" id="resetBtn">Reset</button></div></div></aside>
<div>
<div class="panel"><div class="pb"><canvas id="c" width="800" height="340"></canvas></div></div>
<div class="panel"><div class="ph">Live results</div><div class="pb"><div class="results" id="res"></div></div></div>
<div class="panel"><div class="ph">Formulas</div><div class="pb formulas"><code>v<sub>AB</sub> = v_A − v_B</code></div></div>
</div></div>
</main>
<script src="../lab-theme.js?v=3"></script>
<script>

(function(){
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const va=document.getElementById('va');
const vb=document.getElementById('vb');
let playing=true,t=0,last=0;
function sync(){document.getElementById('vaV').textContent=va.value;document.getElementById('vbV').textContent=vb.value;draw();}
va.oninput=sync;
vb.oninput=sync;
function size(){const d=Math.min(devicePixelRatio||1,2);const W=canvas.clientWidth||720,H=340;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);return [W,H];}

let xa=80,xb=80;
function draw(){
  const [W,H]=size();ctx.fillStyle='#0a1220';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#334155';ctx.beginPath();ctx.moveTo(20,H/2);ctx.lineTo(W-20,H/2);ctx.stroke();
  const va=+va.value,vb=+vb.value;
  xa=(xa+va*0.4+W)%W; xb=(xb+vb*0.4+W)%W;
  ctx.fillStyle='#63e6ff';ctx.fillRect(xa,H/2-28,36,20);
  ctx.fillStyle='#a78bfa';ctx.fillRect(xb,H/2+8,36,20);
  ctx.fillStyle='#94a3b8';ctx.font='12px system-ui';ctx.fillText('A',xa+12,H/2-32);ctx.fillText('B',xb+12,H/2+40);
  res.innerHTML=`<div class="result"><span>v_AB</span><strong>${(va-vb).toFixed(1)} m/s</strong></div><div class="result"><span>|v_AB|</span><strong>${Math.abs(va-vb).toFixed(1)}</strong></div>`;
}

function loop(ts){if(!playing){draw();return;}if(!last)last=ts;const dt=Math.min(0.033,(ts-last)/1000);last=ts;t+=dt;draw();requestAnimationFrame(loop);}
const playBtn=document.getElementById('playBtn'),resetBtn=document.getElementById('resetBtn');
playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?'Pause':'Play';last=0;if(playing)requestAnimationFrame(loop);};
resetBtn.onclick=()=>{playing=false;t=0;last=0;va.value=6;vb.value=2;sync();playBtn.textContent='Play';draw();};
sync();requestAnimationFrame(loop);
})();

</script>
</body></html>

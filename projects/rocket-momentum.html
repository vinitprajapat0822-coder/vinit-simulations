<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rocket Thrust | Vinit Simulation Hub</title>
<link rel="stylesheet" href="../lab-polish.css?v=2">
<style>
:root{color-scheme:dark}body{margin:0;background:#080b16;color:#f2f6ff;font:15px/1.5 system-ui,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 24px));margin:auto}
header{position:sticky;top:0;z-index:5;background:rgba(8,11,22,.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.12)}
.nav{min-height:54px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:8px;align-items:center;font-weight:800}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#67e8f9,#a78bfa);font-weight:900}
.hero{padding:16px 0 8px}.eyebrow{display:inline-block;border:1px solid rgba(99,230,255,.3);color:#63e6ff;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700}
h1{font-size:clamp(20px,4vw,28px);margin:8px 0 4px}.lead{color:#9cabc8;margin:0}
.layout{display:grid;grid-template-columns:minmax(250px,300px) 1fr;gap:12px;padding-bottom:24px}@media(max-width:800px){.layout{grid-template-columns:1fr}}
.panel{background:rgba(16,24,48,.55);border:1px solid rgba(255,255,255,.12);border-radius:16px;backdrop-filter:blur(16px);margin-bottom:12px}
.ph{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.12);font-weight:700}.pb{padding:12px}
label.row{display:flex;justify-content:space-between;font-size:12px;margin:8px 0 4px}input[type=range]{width:100%;accent-color:#63e6ff}
.btn{border:1px solid #34425e;border-radius:11px;background:#141e33;color:#f2f6ff;padding:10px;font-weight:700;cursor:pointer;flex:1}.btn.primary{background:linear-gradient(135deg,#67e8f9,#a78bfa);color:#07111b;border:0}
.actions{display:flex;gap:8px;margin-top:10px}canvas{display:block;width:100%;height:340px;border-radius:12px;background:#0a1220;border:1px solid #24314b}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.result{background:rgba(8,14,28,.8);border:1px solid #2a3a58;border-radius:10px;padding:8px}.result span{display:block;font-size:10px;color:#9cabc8}
.formulas{font-size:12px;color:#9cabc8;line-height:1.7}code{color:#63e6ff}
</style></head><body>
<header><div class="wrap nav"><a class="brand" href="../index.html"><span class="logo">V</span>CONSERVATION</a><a href="../index.html" style="color:#63e6ff">← Hub</a></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">CONSERVATION</div><h1>Rocket Thrust</h1><p class="lead">Thrust = u (dm/dt).</p></section>
<div class="layout">
<aside class="panel"><div class="ph">Controls</div><div class="pb"><label class="row">u_ex (m/s) <span id="uV">200</span></label><input type="range" id="u" min="50" max="400" step="10" value="200">
<label class="row">dm/dt <span id="dmV">1.2</span></label><input type="range" id="dm" min="0.2" max="5" step="0.1" value="1.2">
<label class="row">m (kg) <span id="mV">15</span></label><input type="range" id="m" min="5" max="40" step="1" value="15"><div class="actions"><button class="btn primary" id="playBtn">Play</button><button class="btn" id="resetBtn">Reset</button></div></div></aside>
<div>
<div class="panel"><div class="pb"><canvas id="c" width="800" height="340"></canvas></div></div>
<div class="panel"><div class="ph">Live results</div><div class="pb"><div class="results" id="res"></div></div></div>
<div class="panel"><div class="ph">Formulas</div><div class="pb formulas"><code>Thrust = u dm/dt</code></div></div>
</div></div></main>
<script src="../lab-theme.js?v=3"></script>
<script>(function(){
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const u=document.getElementById('u');
const dm=document.getElementById('dm');
const m=document.getElementById('m');
let playing=true,t=0,last=0;
function sync(){document.getElementById('uV').textContent=u.value;document.getElementById('dmV').textContent=dm.value;document.getElementById('mV').textContent=m.value;draw();}
u.oninput=sync;
dm.oninput=sync;
m.oninput=sync;
function size(){const d=Math.min(devicePixelRatio||1,2);const W=canvas.clientWidth||720,H=340;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);return [W,H];}
function draw(){
 const [W,H]=size();ctx.fillStyle='#0a1220';ctx.fillRect(0,0,W,H);
 const Th=+u.value*+dm.value,a=Th/+m.value;
const y=H-80-(t*40)%(H-100);
ctx.fillStyle='#a78bfa';ctx.fillRect(W/2-14,y,28,48);
ctx.fillStyle='#f97316';ctx.fillRect(W/2-8,y+48,16,18);
res.innerHTML=`<div class="result"><span>Thrust</span><strong>${Th.toFixed(0)} N</strong></div><div class="result"><span>a</span><strong>${a.toFixed(2)} m/s²</strong></div>`;
}
function loop(ts){if(!playing){draw();return;}if(!last)last=ts;last=ts;t+=0.016;draw();requestAnimationFrame(loop);}
document.getElementById('playBtn').onclick=()=>{playing=!playing;playBtn.textContent=playing?'Pause':'Play';last=0;if(playing)requestAnimationFrame(loop);};
document.getElementById('resetBtn').onclick=()=>{playing=false;t=0;u.value=200;dm.value=1.2;m.value=15;sync();playBtn.textContent='Play';};
sync();requestAnimationFrame(loop);
})();</script></body></html>

<html lang="en"><head>

<style>
:root{color-scheme:dark}body{margin:0;background:#080b16;color:#f2f6ff;font:15px/1.5 system-ui,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 24px));margin:auto}
header{position:sticky;top:0;z-index:5;background:rgba(8,11,22,.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.12)}
.nav{min-height:54px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:8px;align-items:center;font-weight:800}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#67e8f9,#a78bfa);font-weight:900}
.hero{padding:16px 0 8px}.eyebrow{display:inline-block;border:1px solid rgba(99,230,255,.3);color:#63e6ff;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700}
h1{font-size:clamp(20px,4vw,28px);margin:8px 0 4px}.lead{color:#9cabc8;margin:0}
.layout{display:grid;grid-template-columns:minmax(250px,300px) 1fr;gap:12px;padding-bottom:24px}@media(max-width:800px){.layout{grid-template-columns:1fr}}
.panel{background:rgba(16,24,48,.55);border:1px solid rgba(255,255,255,.12);border-radius:16px;backdrop-filter:blur(16px);margin-bottom:12px}
.ph{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.12);font-weight:700}.pb{padding:12px}
label.row{display:flex;justify-content:space-between;font-size:12px;margin:8px 0 4px}input[type=range]{width:100%;accent-color:#63e6ff}
.btn{border:1px solid #34425e;border-radius:11px;background:#141e33;color:#f2f6ff;padding:10px;font-weight:700;cursor:pointer;flex:1}.btn.primary{background:linear-gradient(135deg,#67e8f9,#a78bfa);color:#07111b;border:0}
.actions{display:flex;gap:8px;margin-top:10px}canvas{display:block;width:100%;height:340px;border-radius:12px;background:#0a1220;border:1px solid #24314b}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.result{background:rgba(8,14,28,.8);border:1px solid #2a3a58;border-radius:10px;padding:8px}.result span{display:block;font-size:10px;color:#9cabc8}
.formulas{font-size:12px;color:#9cabc8;line-height:1.7}code{color:#63e6ff}

/* Batch 9 · Liquid Flow UI */
body{position:relative;isolation:isolate}
#fluid-bg{position:fixed!important;inset:0!important;z-index:-1!important;display:block!important;width:100vw!important;height:100vh!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;opacity:.88;pointer-events:none!important;touch-action:none!important}
.wrap{width:100%;max-width:1600px;margin-inline:auto;padding-inline:12px}
.control-panel{position:relative;border:1px solid rgba(98,231,255,.24)!important;background:linear-gradient(145deg,rgba(16,24,48,.72),rgba(8,14,28,.68))!important;-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:0 16px 42px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(98,231,255,.05)}
.control-panel .ph,.control-panel .panel-head{border-bottom-color:rgba(255,255,255,.12)}
input[type=range]{accent-color:#00f0ff;filter:drop-shadow(0 0 5px rgba(0,240,255,.35))}
input[type=range]::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(0,240,255,.13),0 0 17px rgba(0,240,255,.72),inset 0 1px 2px rgba(255,255,255,.9)}
input[type=range]::-moz-range-thumb{box-shadow:0 0 0 4px rgba(0,240,255,.13),0 0 17px rgba(0,240,255,.72),inset 0 1px 2px rgba(255,255,255,.9)}
.simulation-stage{position:relative;isolation:isolate;width:100%;min-width:0;border-radius:16px;overflow:hidden}
.simulation-stage>canvas{position:relative;z-index:0;display:block;width:100%;max-width:100%}
.start-overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 50% 42%,rgba(14,30,52,.52),rgba(3,7,16,.78));-webkit-backdrop-filter:blur(13px) saturate(145%);backdrop-filter:blur(13px) saturate(145%)}
.start-overlay[hidden]{display:none!important}
.start-card{width:min(100%,360px);padding:24px 22px;text-align:center;border:1px solid rgba(255,255,255,.2);border-top-color:rgba(255,255,255,.52);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(12,21,38,.62));box-shadow:0 22px 55px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,240,255,.08)}
.start-kicker{display:block;margin-bottom:9px;color:#00f0ff;font-size:10px;font-weight:850;letter-spacing:.18em}
.start-card h2{margin:0 0 7px;color:#f2f7ff;font-size:clamp(18px,3vw,23px)}
.start-card p{margin:0 0 17px;color:#c0cce0;font-size:12px;line-height:1.6}
.start-cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:46px;padding:11px 16px;border:1px solid rgba(255,255,255,.55);border-radius:13px;color:#041018;background:linear-gradient(120deg,#a5f4ff,#00f0ff 55%,#aaa0ff);box-shadow:0 10px 26px rgba(0,240,255,.22),inset 0 1px 0 rgba(255,255,255,.7);font-weight:900;cursor:pointer;transition:transform .22s ease,box-shadow .22s ease}
.start-cta:hover{transform:translateY(-1px);box-shadow:0 13px 32px rgba(0,240,255,.3),inset 0 1px 0 rgba(255,255,255,.8)}
.start-cta:active{transform:scale(.97)}
@media(max-width:600px){.start-card{padding:20px 17px}.simulation-stage{border-radius:12px}}

</style></head><body>
<canvas id="fluid-bg" aria-hidden="true"></canvas>
<header><div class="wrap nav"><a class="brand" href="../index.html"><span class="logo">V</span>CONSERVATION</a><a href="../index.html" style="color:#63e6ff">← Hub</a></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">CONSERVATION</div><h1>2D Collisions</h1><p class="lead">Equal-mass elastic scatter geometry.</p></section>
<div class="layout">
<aside class="panel control-panel"><div class="ph">Controls</div><div class="pb"><label class="row">u₁ (m/s) <span id="uV">6</span></label><input type="range" id="u" min="1" max="15" step="0.5" value="6">
<label class="row">scatter θ (°) <span id="angV">35</span></label><input type="range" id="ang" min="0" max="90" step="5" value="35"><div class="actions"><button class="btn primary" id="playBtn">Play</button><button class="btn" id="resetBtn">Reset</button></div></div></aside>
<div>
<div class="panel"><div class="pb"><div class="simulation-stage" id="simulation-stage"><canvas id="c" width="800" height="340"></canvas><div class="start-overlay" id="startOverlay"><div class="start-card"><span class="start-kicker">VSH · CORE ENGINE</span><h2>Ready to simulate?</h2><p>Launch the lab to begin the interactive canvas experience.</p><button type="button" class="start-cta" id="startSimulationBtn">Start Simulation <span aria-hidden="true">→</span></button></div></div></div></div></div>
<div class="panel"><div class="ph">Live results</div><div class="pb"><div class="results" id="res"></div></div></div>
<div class="panel"><div class="ph">Formulas</div><div class="pb formulas">Equal mass elastic: velocities orthogonal.</div></div>
</div></div></main>
<script src="../lab-theme.js?v=3"></script>
<script src="../core/CanvasManager.js"></script>
<script src="../core/SimulationEngine.js"></script>
<script>
(function(){
const canvas=document.getElementById('c');
let engine=null,started=false,t=0;
const canvasManager=new CanvasManager(canvas,{onResize(){if(engine)engine.renderNow();}});
const ctx=canvasManager.context;
const u=document.getElementById('u');
const ang=document.getElementById('ang');
const playBtn=document.getElementById('playBtn'),resetBtn=document.getElementById('resetBtn'),res=document.getElementById('res');
function sync(){document.getElementById('uV').textContent=u.value;document.getElementById('angV').textContent=ang.value;if(engine&&!engine.isRunning)engine.renderNow();}
function draw(){
 const W=canvasManager.width,H=canvasManager.height;ctx.fillStyle='#0a1220';ctx.fillRect(0,0,W,H);
 const th=+ang.value*Math.PI/180,speed=+u.value,v1=speed*Math.cos(th),v2=speed*Math.sin(th);
 ctx.strokeStyle='#63e6ff';ctx.beginPath();ctx.moveTo(40,H/2);ctx.lineTo(W*0.4,H/2);ctx.stroke();
 ctx.beginPath();ctx.moveTo(W*0.4,H/2);ctx.lineTo(W*0.4+90*Math.cos(th),H/2-90*Math.sin(th));ctx.stroke();
 ctx.strokeStyle='#a78bfa';ctx.beginPath();ctx.moveTo(W*0.4,H/2);ctx.lineTo(W*0.4+90*Math.sin(th),H/2+90*Math.cos(th));ctx.stroke();
 res.innerHTML='<div class="result"><span>v1</span><strong>'+v1.toFixed(2)+'</strong></div><div class="result"><span>v2</span><strong>'+v2.toFixed(2)+'</strong></div>';
}
engine=new SimulationEngine({
 maxDelta:0.05,
 update(dt){t+=dt*0.96;},
 render:draw,
 onReset(){t=0;},
 onStateChange({running}){playBtn.textContent=running?'Pause':'Play';}
});
u.oninput=sync;ang.oninput=sync;
playBtn.onclick=function(){if(!started)return;if(engine.isRunning)engine.pause();else engine.resume();};
resetBtn.onclick=function(){engine.reset();u.value=6;ang.value=35;sync();};
document.getElementById('startSimulationBtn').addEventListener('click',function(){started=true;document.getElementById('startOverlay').hidden=true;engine.start();});
sync();engine.renderNow();
})();
</script><script id="liquid-flow-runtime">
(function(){
  const canvas=document.getElementById('fluid-bg');if(!canvas)return;
  const ctx=canvas.getContext('2d');let width=0,height=0,dpr=1,lastFrame=0,phase=0,rafId=0;
  function resize(){dpr=Math.min(window.devicePixelRatio||1,1.5);width=window.innerWidth;height=window.innerHeight;canvas.width=Math.max(1,Math.round(width*dpr));canvas.height=Math.max(1,Math.round(height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);}
  function frame(timestamp){rafId=requestAnimationFrame(frame);if(timestamp-lastFrame<1000/30)return;const dt=lastFrame?Math.min(0.05,(timestamp-lastFrame)/1000):0;lastFrame=timestamp;phase+=dt*0.22;ctx.clearRect(0,0,width,height);let g=ctx.createRadialGradient(width*(0.16+0.025*Math.sin(phase)),height*0.22,0,width*0.16,height*0.22,Math.max(width,height)*0.72);g.addColorStop(0,'rgba(0,240,255,.12)');g.addColorStop(1,'rgba(0,240,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);g=ctx.createRadialGradient(width*(0.84+0.02*Math.cos(phase*.8)),height*.74,0,width*.84,height*.74,Math.max(width,height)*.62);g.addColorStop(0,'rgba(130,105,255,.11)');g.addColorStop(1,'rgba(130,105,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);}
  function stop(){if(rafId)cancelAnimationFrame(rafId);window.removeEventListener('resize',resize);}
  resize();window.addEventListener('resize',resize,{passive:true});rafId=requestAnimationFrame(frame);window.addEventListener('pagehide',stop,{once:true});
})();
</script>
</body></html>
